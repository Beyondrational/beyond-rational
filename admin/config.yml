# Sveltia CMS configuration (also read by Decap-compatible tooling)

backend:
  name: github
  repo: Beyondrational/beyond-rational
  branch: main
  # OAuth proxy (Cloudflare Worker) that completes "Login with GitHub".
  # See DECAP-SETUP.md for the full walkthrough.
  base_url: https://br-cms-auth.rasmus-177.workers.dev

i18n:
  structure: multiple_files
  locales: [en, da]
  default_locale: en
media_folder: "assets"
public_folder: "assets"

site_url: https://beyondrational.com
display_url: https://beyondrational.com

collections:

  # =============== SITE-WIDE (nav, footer, loader, cookie banner — shown on every page) ===============
  - name: "site"
    label: "Site settings"
    i18n: true
    files:
      - file: "content/site.{{locale}}.json"
        i18n: true
        name: "site"
        label: "Site-wide chrome"
        fields:
          - { label: "Logo (nav + footer, every page)", name: "logo", widget: "image", i18n: "duplicate" }
          - label: "Nav links"
            name: "nav"
            widget: "object"
            i18n: true
            fields:
              - { label: "Products", name: "products", widget: "string", i18n: true }
              - { label: "Projects", name: "projects", widget: "string", i18n: true }
              - { label: "Contact",  name: "contact",  widget: "string", i18n: true }
          - label: "Footer"
            name: "footer"
            widget: "object"
            i18n: true
            fields:
              - { label: "Brand tagline", name: "brand_tagline", widget: "text", i18n: true }
              - { label: "Email",         name: "email",         widget: "string", i18n: true }
              - { label: "Address",       name: "address",       widget: "string", i18n: true }
              - { label: "Copyright",     name: "copyright",     widget: "string", i18n: true }
              - { label: "\"Product\" column heading", name: "product_heading", widget: "string", i18n: true }
              - { label: "Aisti link text",              name: "aisti_label",     widget: "string", i18n: true }
              - { label: "\"Office\" column heading",   name: "office_heading",  widget: "string", i18n: true }
              - { label: "Projects link text",           name: "projects_label",  widget: "string", i18n: true }
              - { label: "\"Contact\" column heading",  name: "contact_heading", widget: "string", i18n: true }
              - { label: "Privacy policy link text",     name: "privacy_label",   widget: "string", hint: "The linked page (privatlivspolitik.html) stays Danish-only regardless of site language", i18n: true }
              - { label: "Terms link text",               name: "terms_label",     widget: "string", hint: "The linked page (betalingsbetingelser.html) stays Danish-only regardless of site language", i18n: true }
              - { label: "Design system link text",       name: "design_system_label",   widget: "string", i18n: true }
              - { label: "Design system version string",  name: "design_system_version", widget: "string", i18n: true }
          - label: "Page loader"
            name: "loader"
            widget: "object"
            i18n: true
            fields:
              - { label: "Brand (top-left)",   name: "brand",   widget: "string", i18n: true }
              - { label: "\"Loading\" label", name: "loading", widget: "string", i18n: true }
          - label: "Cookie banner"
            name: "cookie"
            widget: "object"
            i18n: true
            hint: "Injected on every page by br.js — not tied to any page's HTML."
            fields:
              - { label: "Text (HTML allowed for the privacy-policy link)", name: "text",    widget: "text", i18n: true }
              - { label: "Decline button",                                  name: "decline", widget: "string", i18n: true }
              - { label: "Accept button",                                   name: "accept",  widget: "string", i18n: true }
          - label: "Document gate (shown before a gated download)"
            name: "gate"
            widget: "object"
            i18n: true
            hint: "The box that asks for name, e-mail and company before a gated document downloads. Injected by br.js, like the cookie bar. Turn the gate on or off per document under the product page."
            fields:
              - { label: "Heading",              name: "title",   widget: "string", i18n: true }
              - { label: "Explanation",          name: "body",    widget: "text",   i18n: true }
              - { label: "Name field label",     name: "name",    widget: "string", i18n: true }
              - { label: "E-mail field label",   name: "email",   widget: "string", i18n: true }
              - { label: "Company field label",  name: "company", widget: "string", i18n: true }
              - { label: "Submit button",        name: "submit",  widget: "string", i18n: true }
              - { label: "Cancel button",        name: "cancel",  widget: "string", i18n: true }
              - { label: "Privacy link text",    name: "privacy", widget: "string", i18n: true }
              - { label: "While sending",        name: "sending", widget: "string", i18n: true }
              - { label: "If sending fails",     name: "error",   widget: "text",   i18n: true, hint: "The file is handed over anyway — never block a download because the CRM is down." }
          - label: "Misc shared strings"
            name: "misc"
            widget: "object"
            i18n: true
            fields:
              - { label: "Scroll hint",                 name: "scroll_hint",       widget: "string", i18n: true }
              - { label: "Back-to-home link",            name: "back_home",         widget: "string", i18n: true }
              - { label: "Back-to-products link",         name: "back_products",     widget: "string", i18n: true }
              - { label: "Select dropdown placeholder",   name: "select_placeholder", widget: "string", i18n: true }
              - { label: "Newsletter subscribe button",   name: "subscribe",         widget: "string", i18n: true }
              - { label: "\"Email\" field label",        name: "email_label",       widget: "string", i18n: true }
              - { label: "\"Phone\" field label",        name: "phone_label",       widget: "string", i18n: true }
              - { label: "\"Office\" field label",       name: "office_label",      widget: "string", i18n: true }
              - { label: "\"Hours\" field label",        name: "hours_label",       widget: "string", i18n: true }


  # =============== HOME ===============
  - name: "home"
    label: "Home"
    i18n: true
    files:
      - file: "content/home.{{locale}}.json"
        i18n: true
        name: "home"
        label: "Home page"
        description: "The hero/background photo for this page lives in the matching Images (shared EN/DA) collection further down — edit it there to update both languages at once. Any gallery or list photos on this page are edited directly here, per language."
        fields:

          - { label: "Loader tag (top-right of the loading screen)", name: "loader_tag", widget: "string", i18n: true }

          - label: "Hero"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow left",          name: "eyebrow_left",  widget: "string", i18n: true }
              - { label: "Eyebrow right",         name: "eyebrow_right", widget: "string", i18n: true }
              - { label: "Title line 1",          name: "title_l1",      widget: "string", i18n: true }
              - { label: "Title line 2 (emphasised)", name: "title_l2_em", widget: "string", i18n: true }
              - { label: "Subtitle",              name: "subtitle",      widget: "text", i18n: true }
              - { label: "Primary CTA",           name: "cta_primary",   widget: "string", i18n: true }
              - { label: "Secondary CTA",         name: "cta_secondary", widget: "string", i18n: true }

          - label: "The range (4-image product grid)"
            name: "range"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label", name: "section_label", widget: "string", i18n: true }
              - { label: "Meta tag",      name: "meta",          widget: "string", i18n: true }
              - { label: "Intro",         name: "intro",         widget: "text", i18n: true }
              - { label: "Link label",    name: "link_label",    widget: "string", i18n: true }
              - label: "Products"
                name: "items"
                widget: "list"
                i18n: true
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name",  name: "name",  widget: "string", i18n: true }
                  - { label: "Tag",   name: "tag",   widget: "string", required: false, hint: "Small label above the product name on the homepage card", i18n: true }
                  - { label: "Link",  name: "href",  widget: "string", hint: "e.g. product-aisti.html, product-wuud.html", i18n: "duplicate" }
                  - { label: "Image", name: "image", widget: "image", required: false, i18n: "duplicate" }

          - label: "Mission statement"
            name: "process"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label",        name: "section_label", widget: "string", i18n: true }
              - { label: "Meta tag",             name: "meta",          widget: "string", required: false, hint: "Small label on the right of the section rule", i18n: true }
              - { label: "Title line 1",         name: "title_l1",      widget: "string", i18n: true }
              - { label: "Title line 2 (em)",    name: "title_l2_em",   widget: "string", i18n: true }
              - { label: "Paragraph 1",          name: "body_p1",       widget: "text", i18n: true }
              - { label: "Paragraph 2",          name: "body_p2",       widget: "text", i18n: true }
              - { label: "Paragraph 3",          name: "body_p3",       widget: "text", i18n: true }

          - label: "Office"
            name: "studio"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label",     name: "section_label", widget: "string", i18n: true }
              - { label: "Meta tag",          name: "meta",          widget: "string", required: false, hint: "Small label on the right of the section rule", i18n: true }
              - { label: "Title line 1",      name: "title_l1",      widget: "string", i18n: true }
              - { label: "Title line 2 (em)", name: "title_l2_em",   widget: "string", i18n: true }
              - { label: "Founded year",             name: "stat_founded",        widget: "string", i18n: true }
              - { label: "Founded year — label",     name: "stat_founded_label",  widget: "string", i18n: true }
              - { label: "Supplier count",           name: "stat_people",         widget: "string", i18n: true }
              - { label: "Supplier count — label",   name: "stat_people_label",   widget: "string", i18n: true }
              - { label: "In business since",        name: "stat_studios",        widget: "string", i18n: true }
              - { label: "In business since — label", name: "stat_studios_label", widget: "string", i18n: true }
              - { label: "Body",              name: "body",          widget: "text", i18n: true }
              - { label: "Link label",        name: "link_label",    widget: "string", default: "Contact", i18n: true }

          - label: "Cases"
            name: "cases"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label", name: "section_label", widget: "string", i18n: true }
              - { label: "Link label",    name: "link_label",    widget: "string", i18n: true }
              - label: "Items"
                name: "items"
                widget: "list"
                i18n: true
                fields:
                  - { label: "Link",    name: "href",    widget: "string", hint: "e.g. case-angtvatten-22.html", i18n: "duplicate" }
                  - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
                  - { label: "Title",   name: "title",   widget: "string", i18n: true }
                  - { label: "Meta 1",  name: "meta1",   widget: "string", i18n: true }
                  - { label: "Meta 2",  name: "meta2",   widget: "text", i18n: true }
                  - { label: "Image",   name: "image",   widget: "image", required: false, i18n: "duplicate" }

          - label: "Closing CTA"
            name: "cta"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label",     name: "section_label", widget: "string", i18n: true }
              - { label: "Meta tag",          name: "meta",          widget: "string", required: false, hint: "Small label on the right of the section rule", i18n: true }
              - { label: "Title line 1",      name: "title_l1",      widget: "string", i18n: true }
              - { label: "Title line 2 (em)", name: "title_l2_em",   widget: "string", i18n: true }
              - { label: "Body",              name: "body",          widget: "text", i18n: true }
              - { label: "Email",             name: "email",         widget: "string", i18n: true }

  # =============== CONTACT ===============
  - name: "contact-page"
    label: "Contact"
    i18n: true
    files:
      - file: "content/contact.{{locale}}.json"
        i18n: true
        name: "contact-page"
        label: "Contact page"
        description: "The hero/background photo for this page lives in the matching Images (shared EN/DA) collection further down — edit it there to update both languages at once. Any gallery or list photos on this page are edited directly here, per language."
        fields:

          - { label: "Loader tag (top-right of the loading screen)", name: "loader_tag", widget: "string", i18n: true }

          - label: "Hero"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow",     name: "eyebrow",  widget: "string", i18n: true }
              - { label: "Title line 1", name: "title_l1", widget: "string", i18n: true }
              - { label: "Title line 2", name: "title_l2", widget: "string", i18n: true }
              - { label: "Lede",        name: "lede",     widget: "text", i18n: true }

          - label: "Form section"
            name: "form_section"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label", name: "section_label", widget: "string", i18n: true }
              - { label: "Title line 1",  name: "title_l1",      widget: "string", i18n: true }
              - { label: "Title line 2",  name: "title_l2",      widget: "string", i18n: true }
              - { label: "Intro",         name: "intro",         widget: "text", i18n: true }

              - label: "Contact info shown next to forms"
                name: "contact_info"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Email",  name: "email",  widget: "string", i18n: true }
                  - { label: "Phone",  name: "phone",  widget: "string", i18n: true }
                  - { label: "Office", name: "office", widget: "string", i18n: true }
                  - { label: "Hours",  name: "hours",  widget: "string", i18n: true }

              - label: "Tab labels"
                name: "tabs"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Sample box tab",  name: "sample",  widget: "string", i18n: true }
                  - { label: "Specify tab",     name: "specify", widget: "string", i18n: true }
                  - { label: "Information tab", name: "info",    widget: "string", i18n: true }
                  - { label: "Other tab",       name: "other",   widget: "string", i18n: true }

              - label: "Form 1 — Sample box"
                name: "form_sample"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name label",              name: "name_label",          widget: "string", i18n: true }
                  - { label: "Email label",              name: "email_label",         widget: "string", i18n: true }
                  - { label: "Phone label",              name: "phone_label",         widget: "string", i18n: true }
                  - { label: "Company label",            name: "company_label",       widget: "string", i18n: true }
                  - { label: "Finish label",             name: "finish_label",        widget: "string", i18n: true }
                  - { label: "Finish placeholder",       name: "finish_placeholder",  widget: "string", i18n: true }
                  - { label: "Address label",            name: "address_label",       widget: "string", i18n: true }
                  - { label: "Address placeholder",      name: "address_placeholder", widget: "string", i18n: true }
                  - { label: "Submit button",            name: "submit_label",        widget: "string", i18n: true }

              - label: "Form 2 — Specify for project"
                name: "form_specify"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name label",         name: "name_label",         widget: "string", i18n: true }
                  - { label: "Email label",        name: "email_label",        widget: "string", i18n: true }
                  - { label: "Role label",         name: "role_label",         widget: "string", i18n: true }
                  - label: "Role options"
                    name: "role_options"
                    widget: "list"
                    i18n: true
                    summary: "{{fields.value}}"
                    fields:
                      - { label: "Option", name: "value", widget: "string", i18n: true }
                  - { label: "Company label",      name: "company_label",      widget: "string", i18n: true }
                  - { label: "Project name label",  name: "project_label",      widget: "string", i18n: true }
                  - { label: "Project type label",  name: "type_label",         widget: "string", i18n: true }
                  - label: "Project type options"
                    name: "type_options"
                    widget: "list"
                    i18n: true
                    summary: "{{fields.value}}"
                    fields:
                      - { label: "Option", name: "value", widget: "string", i18n: true }
                  - { label: "Area label",           name: "area_label",         widget: "string", i18n: true }
                  - { label: "Area placeholder",     name: "area_placeholder",   widget: "string", i18n: true }
                  - { label: "Deadline label",       name: "deadline_label",     widget: "string", i18n: true }
                  - { label: "Brief label",          name: "brief_label",        widget: "string", i18n: true }
                  - { label: "Brief placeholder",    name: "brief_placeholder",  widget: "text", i18n: true }
                  - { label: "Submit button",        name: "submit_label",       widget: "string", i18n: true }

              - label: "Form 3 — Information"
                name: "form_info"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name label",    name: "name_label",    widget: "string", i18n: true }
                  - { label: "Email label",   name: "email_label",   widget: "string", i18n: true }
                  - { label: "Company label", name: "company_label", widget: "string", i18n: true }
                  - { label: "Kind label",    name: "kind_label",    widget: "string", i18n: true }
                  - label: "Kind options"
                    name: "kind_options"
                    widget: "list"
                    i18n: true
                    summary: "{{fields.value}}"
                    fields:
                      - { label: "Option", name: "value", widget: "string", i18n: true }
                  - { label: "Message label",       name: "msg_label",       widget: "string", i18n: true }
                  - { label: "Message placeholder", name: "msg_placeholder", widget: "string", i18n: true }
                  - { label: "Submit button",       name: "submit_label",    widget: "string", i18n: true }

              - label: "Form 4 — Other"
                name: "form_other"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Name label",          name: "name_label",       widget: "string", i18n: true }
                  - { label: "Email label",         name: "email_label",      widget: "string", i18n: true }
                  - { label: "Company label",       name: "company_label",    widget: "string", i18n: true }
                  - { label: "Message label",       name: "msg_label",        widget: "string", i18n: true }
                  - { label: "Message placeholder", name: "msg_placeholder",  widget: "string", i18n: true }
                  - { label: "Submit button",       name: "submit_label",     widget: "string", i18n: true }

          - label: "Contact cards"
            name: "contact_cards"
            widget: "object"
            i18n: true
            fields:
              - { label: "Section label", name: "section_label", widget: "string", i18n: true }
              - { label: "Title",         name: "title",         widget: "string", i18n: true }
              - { label: "Intro",         name: "intro",         widget: "string", i18n: true }

              - label: "Morten"
                name: "morten"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
                  - { label: "Name",    name: "name",    widget: "string", i18n: true }
                  - { label: "Role",    name: "role",    widget: "string", i18n: true }
                  - { label: "Email",   name: "email",   widget: "string", i18n: true }
                  - { label: "Phone",   name: "phone",   widget: "string", i18n: true }

              - label: "Rasmus"
                name: "rasmus"
                widget: "object"
                i18n: true
                fields:
                  - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
                  - { label: "Name",    name: "name",    widget: "string", i18n: true }
                  - { label: "Role",    name: "role",    widget: "string", i18n: true }
                  - { label: "Email",   name: "email",   widget: "string", i18n: true }
                  - { label: "Phone",   name: "phone",   widget: "string", i18n: true }

          - label: "Office info (Email / Phone cards)"
            name: "studio_info"
            widget: "object"
            i18n: true
            fields:
              - { label: "Title line 1", name: "title_l1",  widget: "string", i18n: true }
              - { label: "Title line 2", name: "title_l2",  widget: "string", i18n: true }
              - { label: "Email",        name: "email",      widget: "string", i18n: true }
              - { label: "Email note",   name: "email_note", widget: "string", i18n: true }
              - { label: "Phone",        name: "phone",      widget: "string", i18n: true }
              - { label: "Phone note",   name: "phone_note", widget: "string", i18n: true }

          - label: "Follow our journey"
            name: "journey"
            widget: "object"
            i18n: true
            fields:
              - { label: "Title line 1", name: "title_l1", widget: "string", i18n: true }
              - { label: "Title line 2", name: "title_l2", widget: "string", i18n: true }
              - { label: "Body",         name: "body",     widget: "text", i18n: true }

  # =============== PROJECTS ===============
  - name: "projects"
    label: "Projects"
    i18n: true
    files:
      - file: "content/projects.{{locale}}.json"
        i18n: true
        name: "projects"
        label: "Projects page"
        description: "The hero/background photo for this page lives in the matching Images (shared EN/DA) collection further down — edit it there to update both languages at once. Any gallery or list photos on this page are edited directly here, per language."
        fields:

          - { label: "Loader tag (top-right of the loading screen)", name: "loader_tag", widget: "string", i18n: true }

          - label: "Hero"
            name: "hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow",       name: "eyebrow",   widget: "string", i18n: true }
              - { label: "Title line 1",  name: "title_l1",  widget: "string", i18n: true }
              - { label: "Title line 2",  name: "title_l2",  widget: "string", i18n: true }
              - { label: "Subtitle",      name: "subtitle",  widget: "text", i18n: true }

          - label: "Case studies (prose panels)"
            name: "cases"
            widget: "list"
            i18n: true
            hint: "The two large text+image case panels further down the page. Order here must match the two panels on the page (case 1 first, case 2 second)."
            fields:
              - { label: "Case label", name: "case_label", widget: "string", i18n: true }
              - { label: "Country code", name: "country", widget: "string", i18n: true }
              - { label: "Title",  name: "title", widget: "string", i18n: true }
              - { label: "Meta line", name: "meta",  widget: "string", i18n: true }
              - { label: "Body copy", name: "body", widget: "text", i18n: true }

          - label: "Project list"
            name: "list"
            widget: "list"
            i18n: true
            fields:
              - { label: "Number", name: "num",   widget: "string", i18n: true }
              - { label: "Title",  name: "title", widget: "string", i18n: true }
              - { label: "Meta",   name: "meta",  widget: "string", i18n: true }
              - { label: "Year",   name: "year",  widget: "string", i18n: true }

          - label: "Supplier section heading"
            name: "supplier_head"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
              - { label: "Title",   name: "title",   widget: "string", i18n: true }
              - { label: "Body",    name: "body",    widget: "text", i18n: true }

          - label: "Supplier cards"
            name: "supplier_cards"
            widget: "list"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true }
